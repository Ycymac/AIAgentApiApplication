spring:
  application:
    name: knowledge
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ai_application?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: root
    password: 206721
  data:
    redis:
      host: 192.168.88.131
      port: 6379
      password: 206721

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT}
    accessKeyId: ${ALIYUN_OSS_ACCESS_KEY_ID}
    accessKeySecret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    bucketName: ${ALIYUN_OSS_BUCKET_NAME}

rocketmq:
  name-server: 192.168.88.131:9876
  producer:
    group: aiapplication_knowledge-service_common-message-execute_pg
    send-message-timeout: 15000
    retry-times-when-send-failed: 3 #同步发送失败尝试次数
    retry-times-when-send-async-failed: 3 #异步发送失败尝试次数


logging:
  level:
    org.apache.rocketmq: DEBUG
    com.ycy.aiapplication.knowledge.mq: DEBUG

rag:
  collection:
    collection-name: knowledge_default_store
    dimension: 1024
    metric-type: COSINE

ai:
  providers:
    bailian:
      enabled: true
      api-key: ${BAILIAN_API_KEY}
      base-url: https://dashscope.aliyuncs.com
      embedding-path: /api/v1/services/embeddings/text-embedding/text-embedding
      rerank-path: /api/v1/services/rerank/text-rerank/text-rerank
      chat-path: /compatible-mode/v1/chat/completions
    siliconflow:
      enabled: true
      api-key: ${SILICONFLOW_API_KEY}
      base-url: https://api.siliconflow.cn
      embedding-path: /v1/embeddings
      chat-path: /v1/chat/completions
  embedding:
    default-provider: bailian
    fallback-enabled: true
    fallback-order:
      - siliconflow
    batch-size: 10
    dimension: 1024
    models:
      bailian: text-embedding-v4
      siliconflow: Qwen/Qwen3-Embedding-0.6B
  rerank:
    provider: bailian
    primary-model: qwen3-vl-rerank
    backup-models:
      - qwen3-rerank
  chat:
    default-provider: bailian
    default-model: deepseek-v4-flash
    models:
      bailian_1: deepseek-v4-flash
      bailian_2: qwen3.6-flash
      siliconflow_1: deepseek-ai/DeepSeek-V4-Flash
      siliconflow_2: Pro/deepseek-ai/DeepSeek-V3.2
    backup-models:
      - id: bailian_backup
        provider: bailian
        model: qwen3.6-plus
      - id: siliconflow_backup
        provider: siliconflow
        model: deepseek-ai/DeepSeek-V3.2
  selection:
    failure-threshold: 2
    open-duration-ms: 30000
  stream:
    first-packet-timeout-seconds: 60
    executor-core-size: 2
    executor-max-size: 4
    executor-queue-capacity: 128
    message-chunk-size: 5


milvus:
  uri: http://192.168.88.131:19530
server:
  port: 10030
  address: 0.0.0.0
