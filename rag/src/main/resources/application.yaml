spring:
  application:
    name: rag
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ai_application?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: root
    password: 206721
  data:
    redis:
      host: 192.168.88.131
      port: 6379
      password: 206721


mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false


springdoc:
  default-flat-param-object: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ycy.aiapplication.rag

knife4j:
  enable: true
  setting:
    language: zh_cn

rag:
  intent:
    first-layer-min-score: 0.55
    knowledge-min-score: 0.45
    knowledge-top-n: 3
  rewrite:
    query-rewrite-enabled: true
    query-rewrite-max-history-messages: 4
    query-rewrite-max-history-chars: 500
  memory:
    history-keep-turns: 8
    summary-enabled: true
    summary-max-chars: 200
    summary-start-turns: 9
    title-max-length: 30
    ttl-minutes: 60
  vector:
    type: milvus
  retrieve:
    channels:
      intent-directed:
        enabled: true
        top-k-multiplier: 2
      vector-global:
        enabled: true
        top-k-multiplier: 3
  guidance:
    enabled: true
    max-options: 6
    ambiguity-intent-type: unknown
    ambiguity-min-score: 0.45