spring:
  application:
    name: rag
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ai_application?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: root
    password: 206721
  data:
    redis:
      host: 192.168.88.131
      port: 6379
      password: 206721

rocketmq:
  name-server: 192.168.88.131:9876
  producer:
    group: aiapplication_knowledge-service_common-message-execute_pg
    send-message-timeout: 2000
    retry-times-when-send-failed: 1 #同步发送失败尝试次数
    retry-times-when-send-async-failed: 1 #异步发送失败尝试次数


aliyun:
  oss:
    endpoint: needed
    accessKeyId: needed
    accessKeySecret:  needed
    bucketName: needed



mybatis-plus:
  mapper-locations:
    - classpath*:/mapper/**/*.xml
    - classpath*:/com/ycy/aiapplication/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false


springdoc:
  default-flat-param-object: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ycy.aiapplication.rag

knife4j:
  enable: true
  setting:
    language: zh_cn

rag:
  intent:
    first-layer-min-score: 0.55
    knowledge-min-score: 0.45
    knowledge-top-n: 3
  rewrite:
    query-rewrite-enabled: true
    query-rewrite-max-history-messages: 4
    query-rewrite-max-history-chars: 500
  memory:
    history-keep-turns: 8
    summary-enabled: true
    summary-max-chars: 200
    summary-start-turns: 9
    title-max-length: 30
    ttl-minutes: 60
  vector:
    type: milvus
  retrieve:
    channels:
      intent-directed:
        enabled: true
        top-k-multiplier: 2
      vector-global:
        enabled: true
        top-k-multiplier: 3
    strict-data-base-filter-use: false
  guidance:
    enabled: true
    max-options: 6
    ambiguity-intent-type: unknown
    ambiguity-min-score: 0.45
  collection:
    collection-name: knowledge_default_store
    dimension: 1024
    metric-type: COSINE

milvus:
  uri: http://192.168.88.131:19530

server:
  port: 10040
  address: 0.0.0.0

ai:
  providers:
    bailian:
      enabled: true
      api-key: needed
      base-url: https://dashscope.aliyuncs.com
      embedding-path: /api/v1/services/embeddings/text-embedding/text-embedding
      rerank-path: /api/v1/services/rerank/text-rerank/text-rerank
      chat-path: /compatible-mode/v1/chat/completions
    siliconflow:
      enabled: true
      api-key: needed
      base-url: https://api.siliconflow.cn
      embedding-path: /v1/embeddings
      chat-path: /v1/chat/completions
  embedding:
    default-provider: bailian
    fallback-enabled: true
    fallback-order:
      - siliconflow
    batch-size: 16
    dimension: 1024
    models:
      bailian: text-embedding-v4
      siliconflow: Qwen/Qwen3-Embedding-0.6B
  rerank:
    provider: bailian
    primary-model: qwen3-vl-rerank
    backup-models:
      - qwen3-rerank
  chat:
    default-provider: bailian
    default-model: qwen3.6-plus
    bailian-fallback-enabled: true
    silicon-flow-fallback-enabled: true
    bailian-back-up-model: qwen-plus
    silicon-flow-back-up-model: deepseek-ai/DeepSeek-V3.2
    models:
      bailian_1: qwen3.5-flash
      bailian_2: qwen3.5-plus
      siliconflow_1: deepseek-ai/DeepSeek-V4-Flash
      siliconflow_2: Pro/deepseek-ai/DeepSeek-V3.2
  selection:
    failure-threshold: 2
    open-duration-ms: 30000
  stream:
    first-packet-timeout-seconds: 60
    executor-core-size: 2
    executor-max-size: 4
    executor-queue-capacity: 128
    message-chunk-size: 5
