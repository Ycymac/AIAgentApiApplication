server:
  port: 10010

spring:
  application:
    name: agent

springdoc:
  default-flat-param-object: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ycy.agent

knife4j:
  enable: true
  setting:
    language: zh_cn



